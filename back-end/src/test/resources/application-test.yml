spring:
  datasource:
    url: jdbc:h2:mem:drone_test_db;MODE=MySQL;DATABASE_TO_LOWER=FALSE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    show-sql: false

app:
  jwt:
    secret: test-secret-key-aero-monitor-junit-integration-2026-32bytes
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:3000
  seed:
    enabled: false
